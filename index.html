<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>tela de login</title>
</head>
<body>
    <div class="container">
        <form>
            <h1>Entrar na Plataforma</h1>
            <div>
                <input placeholder="Email" type="Email" required>
                <img width="20" height="20" src="https://img.icons8.com/puffy/32/user.png" alt="user"/>
            </div>
             
            <div>
                <input placeholder="Senha" type="password" required>
                <img width="20" height="20" src="https://img.icons8.com/fluency-systems-regular/48/lock--v1.png" alt="lock--v1"/>
                <a href="#">Esqueci minha Senha</a>

            </div>
            <button type="submit"> Entrar</button>
            <div><p>Nao estar cadastrado ?<a href="#">Cadastar</a></p></div>
        </form>
    </div>
</body>
</html>
